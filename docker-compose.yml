version: '3.8'

services:
  home-hub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - NEXTAUTH_SECRET=home-hub-secret-key-change-in-production
      - NEXTAUTH_URL=http://localhost:5000
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    restart: unless-stopped
