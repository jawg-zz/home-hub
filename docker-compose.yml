version: "3.8"

services:
  home-hub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:3000"
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - NEXTAUTH_SECRET=home-hub-secret-key-change-in-production
      - NEXTAUTH_URL=https://home.spidmax.win
    volumes:
      - home-hub-data:/app/prisma
    restart: unless-stopped

volumes:
  home-hub-data:
